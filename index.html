<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Formulario</title>
    <style>
        /* ESTILOS OPCIONALES - Puedes mantener los tuyos o borrar esta sección */
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .mensaje.exito {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .mensaje.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <h1>📝 Formulario de contacto</h1>
    <p>Completa los campos y envía tu información. Los datos se guardarán automáticamente en Google Sheets.</p>

    <!-- ⚠️ EL FORMULARIO - id="miFormulario" es OBLIGATORIO -->
    <form id="miFormulario">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="Nombre" placeholder="Escribe tu nombre completo" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="Email" placeholder="ejemplo@correo.com" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="Mensaje" placeholder="Escribe tu mensaje aquí" rows="4" required></textarea>

        <button type="submit">📤 Enviar datos</button>
    </form>

    <!-- Contenedor para mensajes de éxito/error -->
    <div id="mensaje" class="mensaje"></div>

    <!-- ⚠️ EL SCRIPT - CAMBIA 'TU_SCRIPT_ID' por tu URL real -->
    <script>
        // 🔴 ¡IMPORTANTE! Reemplaza 'TU_SCRIPT_ID' con la URL que obtuviste de Google Apps Script
        // Debe verse como: 'https://script.google.com/macros/s/ABC123xyz/exec'
        const scriptURL = 'https://script.google.com/macros/s/TU_SCRIPT_ID/exec';
        
        const form = document.getElementById('miFormulario');
        const mensajeDiv = document.getElementById('mensaje');

        form.addEventListener('submit', e => {
            e.preventDefault(); // Evita que la página se recargue
            
            // Deshabilita el botón mientras se envía
            const btn = form.querySelector('button[type="submit"]');
            const textoOriginal = btn.textContent;
            btn.textContent = '⏳ Enviando...';
            btn.disabled = true;
            
            // Oculta mensajes anteriores
            mensajeDiv.style.display = 'none';
            mensajeDiv.className = 'mensaje';

            // Envía los datos a Google Sheets
            fetch(scriptURL, { 
                method: 'POST', 
                body: new FormData(form)
            })
            .then(response => {
                if (response.ok) {
                    // Éxito: limpia el formulario y muestra mensaje
                    form.reset();
                    mensajeDiv.textContent = '✅ ¡Datos guardados correctamente en Google Sheets!';
                    mensajeDiv.className = 'mensaje exito';
                    mensajeDiv.style.display = 'block';
                } else {
                    // Error del servidor
                    mensajeDiv.textContent = '❌ Error al guardar los datos. Intenta de nuevo.';
                    mensajeDiv.className = 'mensaje error';
                    mensajeDiv.style.display = 'block';
                }
            })
            .catch(error => {
                // Error de conexión
                console.error('Error:', error);
                mensajeDiv.textContent = '❌ Error de conexión. Revisa tu internet e intenta de nuevo.';
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.style.display = 'block';
            })
            .finally(() => {
                // Restaura el botón
                btn.textContent = textoOriginal;
                btn.disabled = false;
            });
        });
    </script>

</body>
</html>
